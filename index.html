<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حبر</title>
<meta name="description" content="حبر: رسائل وصور وفيديو وملفات مشفّرة، تختفي بعد القراءة بالمؤقت اللي تختاره.">
<meta name="theme-color" content="#141a33">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one full-height app column (max 560px). Screens: onboarding → chat list → chat; sheets slide up from the bottom. Ink-blue on cool paper; messages bleed away like ink when their timer ends. */
:root{
  --paper:#eef0f5; --sheet:#ffffff; --sunk:#e3e7ef; --rule:#d2d8e4;
  --ink:#141a33; --muted:#5d6580; --nib:#2b47c9; --nib-soft:#e2e7fb; --nib-ink:#ffffff;
  --mine:#2b47c9; --mine-ink:#ffffff; --theirs:#ffffff; --theirs-ink:#141a33;
  --bad:#b3263e; --ok:#1f7a55;
  --brand:"Aref Ruqaa","Amiri",serif;
  --body:"IBM Plex Sans Arabic","Geeza Pro",Tahoma,sans-serif;
  --shadow:0 1px 2px rgba(20,26,51,.06),0 14px 40px rgba(20,26,51,.12);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1122; --sheet:#161b30; --sunk:#11152a; --rule:#272e4a;
  --ink:#e8ebf6; --muted:#98a0bd; --nib:#7f95ff; --nib-soft:#1f2850; --nib-ink:#0d1122;
  --mine:#3a55dd; --mine-ink:#ffffff; --theirs:#1e2440; --theirs-ink:#e8ebf6;
  --bad:#ff8b9b; --ok:#6fd3a5; --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1122; --sheet:#161b30; --sunk:#11152a; --rule:#272e4a;
  --ink:#e8ebf6; --muted:#98a0bd; --nib:#7f95ff; --nib-soft:#1f2850; --nib-ink:#0d1122;
  --mine:#3a55dd; --mine-ink:#ffffff; --theirs:#1e2440; --theirs-ink:#e8ebf6;
  --bad:#ff8b9b; --ok:#6fd3a5; --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 40px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:500 17.5px/1.6 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--nib);outline-offset:2px}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;background:var(--sheet);display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:600px){#app{border-inline:1px solid var(--rule)}}
.logo{width:34px;height:34px;flex:none}
.bar{display:flex;align-items:center;gap:8px;padding:12px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule);min-height:62px}
.bar h2{margin:0;font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font:700 1.9rem/1 var(--brand);color:var(--nib);flex:1;display:flex;align-items:center;gap:8px}
.ib{border:0;background:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.15rem;color:var(--ink);flex:none}
.ib:hover{background:var(--sunk)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border:0;background:none;width:100%;text-align:start;border-bottom:1px solid var(--rule)}
.row:hover{background:var(--sunk)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block}
.row .t span{display:block;color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--nib);color:var(--nib-ink);font-size:.76rem;font-weight:700;display:grid;place-items:center}
.empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:.95rem}
.fab{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;border:0;border-radius:18px;padding:14px 20px;background:var(--nib);color:var(--nib-ink);font-weight:700;box-shadow:var(--shadow)}
.sub{display:block;font-size:.76rem;color:var(--muted);font-weight:500}
/* chat */
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px 12px 18px}
.sys{align-self:center;font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 12px;text-align:center}
.b{max-width:82%;border-radius:18px;padding:9px 12px 6px;position:relative;transition:filter .9s,opacity .9s,transform .9s,letter-spacing .9s}
.b.me{align-self:flex-start;background:var(--mine);color:var(--mine-ink);border-start-start-radius:6px}
.b.them{align-self:flex-end;background:var(--theirs);color:var(--theirs-ink);border:1px solid var(--rule);border-start-end-radius:6px}
.b p{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.b .meta{display:flex;align-items:center;gap:6px;font-size:.76rem;opacity:.8;margin-top:3px}
.b.vanish{filter:blur(7px);opacity:0;transform:scale(.96);letter-spacing:.3em}
.cd{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;font-weight:700}
.cd svg{width:14px;height:14px}
.tile{display:flex;align-items:center;gap:10px;border:0;border-radius:12px;padding:10px;background:rgba(127,127,127,.14);color:inherit;width:100%;text-align:start}
.tile i{font-style:normal;font-size:1.5rem}
.tile small{display:block;opacity:.75;font-size:.76rem}
.composer{display:flex;align-items:center;gap:6px;padding:10px max(10px,env(safe-area-inset-right,0px)) 12px max(10px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule)}
.composer textarea{flex:1;min-width:0;border:1px solid var(--rule);background:var(--sunk);border-radius:20px;padding:9px 14px;resize:none;max-height:120px;line-height:1.4}
.timer{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;color:var(--nib)}
.send{border:0;width:44px;height:44px;border-radius:50%;background:var(--nib);color:var(--nib-ink);font-size:1.15rem;flex:none}
.send:disabled{opacity:.5}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(10,14,30,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--sheet);width:100%;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;max-height:88%;overflow:auto}
.sheet h3{margin:0;font-size:1.05rem}
.opt{border:1px solid var(--rule);background:var(--sheet);border-radius:14px;padding:11px 14px;text-align:start;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.opt[aria-pressed="true"]{border-color:var(--nib);background:var(--nib-soft);color:var(--nib)}
.opt.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.viewer{position:absolute;inset:0;background:#05070f;z-index:30;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.viewer header{display:flex;align-items:center;gap:8px;padding:14px 16px}
.viewer header .x{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700}
.viewer .stage{flex:1;display:grid;place-items:center;padding:12px;min-height:0}
.viewer .stage img,.viewer .stage video{max-width:100%;max-height:100%;border-radius:12px}
.viewer a{color:#9fb0ff}
.toast{position:absolute;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:700;z-index:50;max-width:90%;text-align:center}
.banner{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;z-index:40;background:var(--sheet);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;display:flex;gap:10px;align-items:center;animation:drop .3s ease-out;text-align:start}
.banner b{display:block;font-size:.9rem}.banner span{font-size:.85rem;color:var(--muted)}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
/* forms */
.ob{padding:26px 20px 40px;display:grid;gap:14px;align-content:start}
.big{font:700 4rem/1 var(--brand);color:var(--nib);display:flex;justify-content:center;align-items:center;gap:12px}
.big .logo{width:64px;height:64px}
.ob > p{margin:0;text-align:center;color:var(--muted)}
.f{display:grid;gap:5px}
.f label{font-size:.85rem;font-weight:700;color:var(--muted)}
.in{border:1px solid var(--rule);background:var(--sunk);border-radius:12px;padding:11px 12px;width:100%}
.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--nib);color:var(--nib-ink);font-weight:700}
.btn:disabled{opacity:.6}
.btn.ghost{background:none;border:1px solid var(--rule);color:var(--ink)}
.hint{font-size:.84rem;color:var(--muted);margin:0}
.sec{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:8px 2px -4px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--rule);border-radius:14px;padding:10px 14px;font-weight:600}
.tg small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.tg input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:999px;background:var(--rule);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.tg input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:inset-inline-start .2s}
.tg input:checked{background:var(--nib)}
.tg input:checked::after{inset-inline-start:21px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--nib);background:var(--nib-soft);color:var(--nib)}
.lock{position:absolute;inset:0;z-index:45;background:var(--sheet);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px}
.lock p{margin:0;color:var(--muted);text-align:center}
.pins{display:flex;gap:14px;direction:ltr}
.pins i{width:15px;height:15px;border-radius:50%;border:2px solid var(--nib)}
.pins i.on{background:var(--nib)}
.pins.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,68px);gap:12px;direction:ltr}
.keys button{width:68px;height:68px;border-radius:50%;border:1px solid var(--rule);background:var(--sunk);font-size:1.4rem;font-weight:600}
.keys button.t{border:0;background:none;font-size:.9rem;color:var(--nib)}
.card{border:1px solid var(--rule);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.mono{font-family:ui-monospace,Menlo,monospace;direction:ltr;letter-spacing:.08em}
.off{padding:8px 12px;text-align:center;font-size:.82rem;background:var(--nib-soft);color:var(--nib);font-weight:700}
[dir=ltr] .b.me{align-self:flex-end;border-start-start-radius:18px;border-start-end-radius:6px}
[dir=ltr] .b.them{align-self:flex-start;border-start-end-radius:18px;border-start-start-radius:6px}
@media (prefers-reduced-motion:reduce){.b{transition:none}.banner,.pins.shake{animation:none}}
</style>
</head>

async function rpc(fn, args){
  if(!SB.url) throw new Error(L('إعدادات قاعدة البيانات ناقصة'));
  let r; try{ r = await fetch(SB.url + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:SB.key, 'Content-Type':'application/json' }, body:JSON.stringify(args || {}) }); }
  catch(e){ ONLINE = false; throw new Error(L('ما فيه اتصال بالإنترنت')); }
  ONLINE = true;
  const t = await r.text(); let j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
  if(!r.ok) throw new Error((j && (j.message || j.hint)) || L('صار خطأ، حاول مرة ثانية'));
  return j;
}
const auth = () => ({ p_id:ACCT.id, p_secret:ACCT.secret });
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
async function upload(bytes){
  const path = 'm/' + uuid();
  const go = h => fetch(SB.url + '/storage/v1/object/hibr/' + path, { method:'POST', headers:Object.assign({ apikey:SB.key, 'Content-Type':'application/octet-stream', 'x-upsert':'false' }, h), body:bytes });
  let r = await go({}); if(!r.ok && [400, 401, 403].includes(r.status)) r = await go({ Authorization:'Bearer ' + SB.key });
  if(!r.ok) throw new Error(r.status === 413 ? L('الملف كبير، الحد 25 ميجا') : L('ما قدرت أرفع الملف'));
  return path;
}
function dropMedia(paths){ paths = (paths || []).filter(Boolean); if(!paths.length) return;
  const go = h => fetch(SB.url + '/storage/v1/object/hibr', { method:'DELETE', headers:Object.assign({ apikey:SB.key, 'Content-Type':'application/json' }, h), body:JSON.stringify({ prefixes:paths }) });
  go({}).then(r => { if(!r.ok) go({ Authorization:'Bearer ' + SB.key }); }).catch(() => {}); }
const mediaUrl = p => SB.url + '/storage/v1/object/public/hibr/' + p;

/* ---------- crypto (ECDH P-256 + AES-GCM) ---------- */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const subtle = crypto.subtle;
async function newKeys(){
  const k = await subtle.generateKey({ name:'ECDH', namedCurve:'P-256' }, true, ['deriveKey']);
  return { pub:b64(await subtle.exportKey('raw', k.publicKey)), priv:await subtle.exportKey('jwk', k.privateKey) };
}
let PRIV = null; const SHARED = {};
async function shared(peerPub){
  if(SHARED[peerPub]) return SHARED[peerPub];
  PRIV = PRIV || await subtle.importKey('jwk', KEYS.priv, { name:'ECDH', namedCurve:'P-256' }, false, ['deriveKey']);
  const pub = await subtle.importKey('raw', unb64(peerPub), { name:'ECDH', namedCurve:'P-256' }, false, []);
  return SHARED[peerPub] = subtle.deriveKey({ name:'ECDH', public:pub }, PRIV, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);
}
async function seal(peerPub, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12)), key = await shared(peerPub);
  const ct = await subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return b64(iv) + '.' + b64(ct);
}
async function open_(peerPub, body){
  const [iv, ct] = body.split('.'); const key = await shared(peerPub);
  return JSON.parse(new TextDecoder().decode(await subtle.decrypt({ name:'AES-GCM', iv:unb64(iv) }, key, unb64(ct))));
}
async function sealFile(buf){
  const k = crypto.getRandomValues(new Uint8Array(32)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await subtle.importKey('raw', k, 'AES-GCM', false, ['encrypt']);
  return { bytes:new Uint8Array(await subtle.encrypt({ name:'AES-GCM', iv }, key, buf)), k:b64(k), iv:b64(iv) };
}
async function openFile(path, k, iv, type){
  const r = await fetch(mediaUrl(path)); if(!r.ok) throw new Error(L('المرفق انحذف'));
  const key = await subtle.importKey('raw', unb64(k), 'AES-GCM', false, ['decrypt']);
  return new Blob([await subtle.decrypt({ name:'AES-GCM', iv:unb64(iv) }, key, await r.arrayBuffer())], { type:type || 'application/octet-stream' });
}
async function fingerprint(a, b){ const d = await subtle.digest('SHA-256', new TextEncoder().encode([a, b].sort().join('|'))); return [...new Uint8Array(d)].slice(0, 10).map(x => String(x % 100).padStart(2, '0')).join(' '); }
async function sha(s){ const d = await subtle.digest('SHA-256', new TextEncoder().encode('hibr:' + s)); return b64(d); }

function overlay(build){ const o = el('div', { class:'ov' }), s = el('div', { class:'sheet', role:'dialog' }); const close = () => o.remove(); o.onclick = e => { if(e.target === o) close(); }; build(s, close); o.append(s); app.append(o); return close; }
function sure(e, msg, fn){ const b = e.currentTarget; if(!b.dataset.sure){ b.dataset.sure = 1; b.dataset.old = b.textContent; b.textContent = msg; setTimeout(() => { if(b.isConnected){ delete b.dataset.sure; b.textContent = b.dataset.old; } }, 3500); return; } fn(); }
const peerName = p => p ? (p.nick || p.name || (p.username ? '@' + p.username : L('مستخدم حبر'))) : L('مستخدم حبر');
const snow = () => Date.now() + SKEW;
const fmtLeft = s => s < 60 ? Math.ceil(s) + L('ث') : s < 3600 ? Math.ceil(s / 60) + L('د') : s < 86400 ? Math.ceil(s / 3600) + L('س') : Math.ceil(s / 86400) + L('ي');
const leftOf = m => m.expires_at ? Math.max(0, (new Date(m.expires_at) - snow()) / 1000) : null;
function ring(frac){ const c = 2 * Math.PI * 6; return '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2"/><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="' + (c * Math.min(1, frac)).toFixed(2) + ' ' + c.toFixed(2) + '" transform="rotate(-90 8 8)" stroke-linecap="round"/></svg>'; }
const isMuted = id => (PREFS.muted[id] || 0) > Date.now();
let AC = null;
function play(kind){ if(PREFS.silent || kind === 'none') return; try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime;
  const tone = (f1, f2, at, dur, vol) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(f1, t + at); o.frequency.exponentialRampToValueAtTime(f2, t + at + dur); g.gain.setValueAtTime(0.0001, t + at); g.gain.exponentialRampToValueAtTime(vol, t + at + .02); g.gain.exponentialRampToValueAtTime(0.0001, t + at + dur); o.connect(g).connect(AC.destination); o.start(t + at); o.stop(t + at + dur + .05); };
  if(kind === 'drop') tone(1100, 420, 0, .28, .25);
  if(kind === 'quill'){ tone(2400, 1800, 0, .06, .12); tone(2600, 2000, .09, .06, .12); }
  if(kind === 'chime'){ tone(880, 880, 0, .35, .18); tone(1320, 1320, .16, .5, .14); }
}catch(e){} }

/* ---------- render ---------- */
function render(){
  const keep = app.querySelector('#msg')?.value || '', scroller = app.querySelector('.scroll'), atBottom = scroller ? scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 60 : true, top = scroller ? scroller.scrollTop : 0;
  const prevScreen = render._last; render._last = VIEW.screen + ':' + VIEW.chat;
  app.querySelectorAll(':scope > :not(.ov):not(.viewer):not(.toast):not(.banner)').forEach(n => n.remove());
  if(!ACCT) return onboard();
  if(LOCKED) return pinScreen(L('حبر مقفل'), L('ادخل رمزك عشان تفتح حبر'), () => { LOCKED = false; render(); });
  if(VIEW.screen === 'chat') chatScreen(keep, prevScreen === render._last ? (atBottom ? 'bottom' : top) : 'bottom');
  else if(VIEW.screen === 'settings') settingsScreen();
  else listScreen(prevScreen === render._last ? top : 0);
}

function listScreen(top){
  const bar = el('div', { class:'bar' }, el('span', { class:'brand', html:LOGO + L('حبر') }), el('button', { class:'ib', type:'button', 'aria-label':L('جهات الاتصال'), text:'👥', onclick:contactsSheet }), el('button', { class:'ib', type:'button', 'aria-label':L('الإعدادات'), text:'⚙️', onclick:() => { VIEW = { screen:'settings' }; render(); } }));
  const sc = el('div', { class:'scroll' });
  const ids = new Set(Object.keys(PEERS));
  MSGS.forEach(m => ids.add(m.from === ACCT.id ? m.to : m.from));
  const list = [...ids].map(id => { const ms = MSGS.filter(m => m.from === id || m.to === id); return { id, ms, last:ms[ms.length - 1], n:ms.filter(m => m.from === id && !m.read_at && m.kind !== 'sys').length }; })
    .filter(x => PEERS[x.id] && (x.ms.length || PEERS[x.id].saved)).sort((a, b) => (b.last ? +new Date(b.last.created_at) : 0) - (a.last ? +new Date(a.last.created_at) : 0));
  if(!ONLINE) sc.append(el('div', { class:'off', text:L('ما فيه اتصال بالإنترنت، بنحاول مرة ثانية…') }));
  if(!list.length) sc.append(el('div', { class:'empty' }, el('div', { style:'font-size:2.4rem', text:'✍️' }), el('p', { text:L('ما عندك محادثات للحين.') }), el('p', { class:'hint', text:L('اضغط «محادثة جديدة» واكتب اسم المستخدم حق صديقك. ') + (ME && ME.username ? L('واسمك أنت: @') + ME.username : '') })));
  list.forEach(({ id, last, n }) => {
    const P = PEERS[id], locked = PREFS.lockedChats.includes(id);
    const line = locked ? L('محادثة مقفلة 🔒') : !last ? L('كل شي تلاشى ✍️') : last.from === ACCT.id ? L('أنت: ') + ({ text:L('🔒 رسالة'), photo:L('📷 صورة'), video:L('🎬 فيديو'), file:L('📄 ملف'), sys:'' }[last.kind]) + (last.read_at ? L(' · انقرت') : L(' · وصلت')) : (n ? n + L(' رسالة جديدة') : L('انقرت'));
    sc.append(el('button', { class:'row', type:'button', onclick:() => openChat(id) },
      el('span', { class:'av', style:'background:' + colorOf(id), text:peerName(P).replace('@', '')[0] }),
      el('span', { class:'t' }, el('b', { text:peerName(P) + (P.blocked ? ' ⛔' : '') + (locked ? ' 🔒' : '') + (isMuted(id) ? ' 🔕' : '') }), el('span', { text:line })),
      n && !locked ? el('span', { class:'dot', text:n }) : null));
  });
  if(list.length) sc.append(el('p', { class:'empty', text:L('المحادثات بين شخصين بس. ما فيه مجموعات في حبر.') }));
  app.prepend(bar, sc, el('button', { class:'fab', type:'button', text:L('✍️ محادثة جديدة'), onclick:newChat }));
  sc.scrollTop = top;
}

          el('button', { class:'btn', type:'button', text:L('💾 احفظه وابدأ المحادثة'), onclick:() => { PEERS[r.id] = Object.assign(PEERS[r.id] || {}, r, { nick:nick.value.trim() || null, saved:true }); savePeers(); close(); openChat(r.id); } }));
      }catch(e){ res.replaceChildren(el('p', { class:'hint', text:e.message })); } go.disabled = false; };

      el('button', { class:'btn ghost', type:'button', text:L('إلغاء'), onclick:close }));

    const draw = () => { const v = q.value.trim().toLowerCase();
      const list = Object.values(PEERS).filter(p => p.saved || MSGS.some(m => m.from === p.id || m.to === p.id)).filter(p => !v || [p.nick, p.name, p.username].some(x => x && x.toLowerCase().includes(v.replace(/^@/, '')))).sort((a, b) => peerName(a).localeCompare(peerName(b), 'ar'));

    s.append(el('h3', { text:'✏️ ' + peerName(P) }), el('div', { class:'f' }, el('label', { for:'eNick', text:L('احفظه باسم') }), nick),

      el('button', { class:'opt bad', type:'button', text:L('🗑️ احذفه من جهات الاتصال'), onclick:e => sure(e, L('متأكد؟ اضغط مرة ثانية'), () => { if(MSGS.some(m => m.from === id || m.to === id)){ P.saved = false; P.nick = null; } else delete PEERS[id]; savePeers(); close(); render(); toast(L('انحذف من جهات الاتصال')); }) }),

function copy(t, msg){ (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(msg || L('انسخ ✅')), () => toast(t)); }
function openChat(id){
  const go = () => { VIEW = { screen:'chat', chat:id }; render(); markRead(); refreshPeer(id); };
  if(PREFS.lockedChats.includes(id) && !OPEN.has(id)) return pinScreen(L('محادثة مقفلة 🔒'), L('ادخل رمزك عشان تفتح محادثة ') + peerName(PEERS[id]), () => { OPEN.add(id); go(); }, () => render());
  go();
}
function leaveChat(){
  const id = VIEW.chat; finishRead(id); OPEN.delete(id);
  VIEW = { screen:'list' }; render();
}
function finishRead(id){
  const done = MSGS.filter(m => m.from === id && m.to === ACCT.id && m.timer === 0 && m.read_at && m.kind === 'text').map(m => m.id);
  if(!done.length) return;
  done.forEach(vanishId); rpc('hb_done', Object.assign(auth(), { p_ids:done })).catch(() => {});
}
function presence(id){ const c = PRES[id]; if(!c) return ''; if(c.online) return L('🟢 متصل الحين'); if(c.last_seen){ const m = Math.round((snow() - new Date(c.last_seen)) / 60000); return L('آخر ظهور ') + (m < 1 ? L('قبل شوي') : m < 60 ? L('قبل ') + m + L(' دقيقة') : m < 1440 ? L('قبل ') + Math.round(m / 60) + L(' ساعة') : L('قبل ') + Math.round(m / 1440) + L(' يوم')); } return ''; }
async function refreshPeer(id){ try{ const r = await rpc('hb_peers', Object.assign(auth(), { p_ids:[id] })); if(r && r[0]){ PRES[id] = r[0]; const P = PEERS[id]; if(P && r[0].pubkey !== P.pubkey){ P.pubkey = r[0].pubkey; savePeers(); } const s = app.querySelector('#pres'); if(s) s.textContent = presence(id); } }catch(e){} }

function bubble(m){
  if(m.kind === 'sys') return el('div', { class:'sys', text:(PLAIN.get(m.id) || {}).t || '' });
  const mine = m.from === ACCT.id, b = el('div', { class:'b ' + (mine ? 'me' : 'them'), 'data-id':m.id }), P = PLAIN.get(m.id);
  if(!P) b.append(el('p', { text:L('🔒 ما قدرت أفتح هالرسالة (المفتاح تغيّر)') }));
  else if(m.kind === 'text') b.append(el('p', { text:P.t }));
  else {
    const ic = { photo:'📷', video:'🎬', file:'📄' }[m.kind], lbl = { photo:L('صورة'), video:L('فيديو'), file:L('ملف') }[m.kind];
    if(!mine && !m.read_at) b.append(el('button', { class:'tile', type:'button', onclick:() => viewMedia(m) }, el('i', { text:ic }), el('span', {}, lbl + L(': اضغط للفتح'), el('small', { text:(P.name || '') + L(' · ينفتح مرة وحدة') }))));
    else if(!mine) b.append(el('button', { class:'tile', type:'button', onclick:() => viewMedia(m) }, el('i', { text:ic }), el('span', {}, lbl, el('small', { text:(P.name || '') + ' · ' + (m.timer === 0 ? L('اضغط تفتحه، يختفي أول ما تقفل') : L('تقدر تفتحه لين يخلص المؤقت')) }))));
    else b.append(el('div', { class:'tile' }, el('i', { text:ic }), el('span', {}, lbl, el('small', { text:(P.name || '') + (m.read_at ? L(' · انفتح') : L(' · ما انفتح للحين')) }))));
  }
  const l = leftOf(m);
  b.append(el('div', { class:'meta' }, l != null ? el('span', { class:'cd', 'data-cd':m.id, html:ring(l / (m.timer || 1)) + fmtLeft(l) }) : el('span', { class:'cd', text:'⏱ ' + tName(m.timer) }),
    mine ? el('span', { text:m.read_at ? L('· 👁 انقرت') : L('· ✓ وصلت') }) : null));
  return b;
}
function chatScreen(keep, scrollTo){
  const id = VIEW.chat, P = PEERS[id] || {};
  const bar = el('div', { class:'bar' },
    el('button', { class:'ib', type:'button', 'aria-label':L('رجوع'), text:BACK, onclick:leaveChat }),
    el('span', { class:'av', style:'width:38px;height:38px;background:' + colorOf(id), text:peerName(P).replace('@', '')[0] }),
    el('h2', {}, peerName(P), el('span', { class:'sub', id:'pres', text:presence(id) })),
    el('button', { class:'ib', type:'button', 'aria-label':L('خيارات'), text:'⋮', onclick:() => chatMenu(id) }));
  const sc = el('div', { class:'scroll' }), box = el('div', { class:'msgs' });
  box.append(el('div', { class:'sys', text:L('🔒 مشفّرة بين هاتفك وهاتفه بس. تختفي من الجهتين بعد المؤقت') }));
  MSGS.filter(m => m.from === id || m.to === id).forEach(m => box.append(bubble(m)));
  if(P.blocked) box.append(el('div', { class:'sys', text:L('⛔ حظرت ') + peerName(P) + L('. ما توصلك رسائله.') }));
  sc.append(box);
  const timer = PREFS.chatTimer[id] ?? PREFS.def;
  const inp = el('textarea', { id:'msg', rows:1, placeholder:L('اكتب بالحبر…'), 'aria-label':L('الرسالة') }); inp.value = keep;
  inp.oninput = () => { inp.style.height = 'auto'; inp.style.height = Math.min(120, inp.scrollHeight) + 'px'; };
  const sendBtn = el('button', { class:'send', type:'button', 'aria-label':L('إرسال'), text:'↑' });
  const file = el('input', { type:'file', hidden:true, id:'file', onchange:e => { const f = e.target.files[0]; e.target.value = ''; if(f) sendFile(id, f); } });
  sendBtn.onclick = async () => { const v = inp.value.trim(); if(!v) return; sendBtn.disabled = true; inp.value = ''; inp.style.height = 'auto'; try{ await sendMsg(id, 'text', { t:v }); }catch(e){ toast(e.message); const n = app.querySelector('#msg'); if(n && !n.value) n.value = v; } sendBtn.disabled = false; app.querySelector('#msg')?.focus(); };
  inp.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey && !NATIVE && matchMedia('(pointer:fine)').matches){ e.preventDefault(); sendBtn.click(); } };
  const comp = el('div', { class:'composer' },
    el('button', { class:'ib', type:'button', 'aria-label':L('إرفاق صورة أو فيديو أو ملف'), text:'📎', onclick:() => file.click() }), file,
    el('button', { class:'timer', type:'button', text:'⏱ ' + tName(timer), onclick:() => pickTimer(id) }), inp, sendBtn);
  app.prepend(bar, sc, comp);
  if(P.blocked) comp.hidden = true;
  requestAnimationFrame(() => { sc.scrollTop = scrollTo === 'bottom' ? sc.scrollHeight : scrollTo; });
}
async function sendMsg(id, kind, payload, media){
  const P = PEERS[id]; if(!P || !P.pubkey) throw new Error(L('ما لقيت مفتاح صديقك'));
  const timer = kind === 'sys' ? 0 : (PREFS.chatTimer[id] ?? PREFS.def);
  const body = await seal(P.pubkey, payload);
  const r = await rpc('hb_send', Object.assign(auth(), { p_to:id, p_kind:kind, p_body:body, p_timer:timer, p_media:media || null }));
  PLAIN.set(r.id, payload);
  MSGS.push({ id:r.id, created_at:r.created_at, from:ACCT.id, to:id, kind, body, media:media || null, timer, read_at:null, expires_at:null });
  render();
}
async function sendFile(id, f){
  if(f.size > 25 * 1024 * 1024) return toast(L('الملف كبير، الحد 25 ميجا'));
  const kind = f.type.startsWith('image/') ? 'photo' : f.type.startsWith('video/') ? 'video' : 'file';
  toast(L('أشفّر وأرفع ') + ({ photo:L('الصورة'), video:L('الفيديو'), file:L('الملف') }[kind]) + '…');
  try{ const enc = await sealFile(await f.arrayBuffer()); const path = await upload(enc.bytes);
    await sendMsg(id, kind, { name:f.name, type:f.type, size:f.size, k:enc.k, iv:enc.iv }, path); toast(L('انرسل ✅')); }
  catch(e){ toast(e.message); }
}
function pickTimer(id){
  overlay((s, close) => {
    const cur = PREFS.chatTimer[id] ?? PREFS.def;
    s.append(el('h3', { text:L('⏱ متى تختفي رسائلك هنا؟') }), el('p', { class:'hint', text:L('العد يبدأ من لحظة ما يقرأها صديقك، مو من الإرسال. «بعد القراءة» تختفي أول ما يطلع من المحادثة.') }),
      el('div', { class:'grid2' }, TIMERS.map(([v, n]) => el('button', { class:'opt', type:'button', 'aria-pressed':String(cur === v), text:n, onclick:() => { PREFS.chatTimer[id] = v; savePrefs(); close(); render(); } }))));
  });
}

let syncing = false, firstSync = true, lastIds = new Set();
async function sync(){
  if(!ACCT || syncing) return; syncing = true;
  try{
    const r = await rpc('hb_inbox', auth());
    SKEW = new Date(r.now) - Date.now();
    dropMedia(r.gone_media);
    const incoming = r.msgs || [], seen = new Set(incoming.map(m => m.id));
    // senders we don't know yet
    const unknown = [...new Set(incoming.map(m => m.from === ACCT.id ? m.to : m.from))].filter(id => !PEERS[id] || !PEERS[id].pubkey);
    if(unknown.length){ const cards = await rpc('hb_peers', Object.assign(auth(), { p_ids:unknown })); (cards || []).forEach(c => { PEERS[c.id] = Object.assign(PEERS[c.id] || {}, c); }); savePeers(); }
    for(const m of incoming){ if(PLAIN.has(m.id)) continue; const peer = PEERS[m.from === ACCT.id ? m.to : m.from]; try{ PLAIN.set(m.id, await open_(peer.pubkey, m.body)); }catch(e){ PLAIN.set(m.id, null); } }
    const fresh = incoming.filter(m => m.to === ACCT.id && !lastIds.has(m.id) && m.kind !== 'sys');
    // vanished: anything we had that the server no longer has
    MSGS.filter(m => !seen.has(m.id)).forEach(m => vanishId(m.id, true));
    MSGS = incoming.filter(m => !PEERS[m.from === ACCT.id ? m.to : m.from]?.blocked || m.from === ACCT.id);
    lastIds = seen;
    if(!firstSync) fresh.forEach(notify);
    firstSync = false;
    if(!app.querySelector('.ov, .lock, .viewer')) render();
    markRead();
    if(VIEW.screen === 'chat') refreshPeer(VIEW.chat);
  }catch(e){ if(/مو موجود على هالهاتف/.test(e.message)){ toast(L('حسابك انحذف من هالهاتف')); } else if(!ONLINE && !app.querySelector('.ov')) render(); }
  syncing = false;
}
function markRead(){

  if(!ids.length) return;
  MSGS.forEach(m => { if(ids.includes(m.id)){ m.read_at = new Date(snow()).toISOString(); if(m.timer) m.expires_at = new Date(snow() + m.timer * 1000).toISOString(); } });

}
const vanishing = new Set();
function vanishId(id){
  if(vanishing.has(id)) return; vanishing.add(id);
  app.querySelectorAll('[data-id="' + id + '"]').forEach(b => b.classList.add('vanish'));
  setTimeout(() => { MSGS = MSGS.filter(m => m.id !== id); PLAIN.delete(id); vanishing.delete(id); if(!app.querySelector('.ov, .lock, .viewer')) render(); }, 950);
}
function notify(m){
  const id = m.from, P = PEERS[id];
  if(!PREFS.notif || !P || P.blocked || isMuted(id)) return;
  if(VIEW.screen === 'chat' && VIEW.chat === id && document.visibilityState === 'visible') return;
  const pl = PLAIN.get(m.id), locked = PREFS.lockedChats.includes(id);
  const what = PREFS.preview && !locked && m.kind === 'text' && pl ? pl.t : { text:L('رسالة جديدة 🔒'), photo:L('📷 صورة'), video:L('🎬 فيديو'), file:L('📄 ملف') }[m.kind];
  app.querySelector('.banner')?.remove();
  const bn = el('button', { class:'banner', type:'button', onclick:() => { bn.remove(); app.querySelectorAll('.ov').forEach(o => o.remove()); openChat(id); } },
    el('span', { class:'av', style:'width:36px;height:36px;background:' + colorOf(id), text:peerName(P).replace('@', '')[0] }), el('span', {}, el('b', { text:L('حبر · ') + peerName(P) }), el('span', { text:what })));
  app.append(bn); setTimeout(() => bn.remove(), 4000);
  play(PREFS.sound);
}
// countdown ticks + local expiry
setInterval(() => {
  app.querySelectorAll('[data-cd]').forEach(e => { const m = MSGS.find(x => x.id === e.dataset.cd); const l = m && leftOf(m); if(l != null){ e.innerHTML = ring(l / (m.timer || 1)) + fmtLeft(l); if(l <= 0) vanishId(m.id); } });
}, 250);
let timer = null;
function schedule(){ clearInterval(timer); timer = setInterval(() => { if(document.visibilityState === 'visible') sync(); }, VIEW.screen === 'chat' ? 2000 : 4000); }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ if(VIEW.screen === 'chat') finishRead(VIEW.chat); if(PREFS.appLock && PREFS.pin){ LOCKED = true; OPEN.clear(); } }
  else { render(); sync(); }
});
const _render = render; render = function(){ _render(); schedule(); };

render();
if(ACCT){ sync(); rpc('hb_me', auth()).then(m => { ME = m; LS.set('hb-me', ME); }).catch(() => {}); }
})();
</script>
